[pytest]
# pytest 配置文件
# 定义测试运行的默认选项和配置

# 测试文件发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    pbt: 属性测试 (Property-Based Testing)
    slow: 慢速测试
    auth: 认证相关测试
    users: 用户管理测试
    warehouses: 仓库管理测试
    attendance: 考勤测试
    piece_work: 计件测试
    leave: 请假测试
    vehicles: 车辆测试
    notifications: 通知测试
    permissions: 权限测试
    sse: SSE 实时通信测试

# 日志配置
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 超时配置（需要 pytest-timeout 插件）
# timeout = 60

# 并行测试配置（需要 pytest-xdist 插件）
# 少量测试用串行更快，大量测试用: pytest -n auto
# addopts = -n auto

# 车队管家 Docker Compose 配置
# 一键部署后端、前端和数据库服务
# 
# 使用方法：
#   开发环境：docker-compose up -d
#   生产环境：docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ============================================
  # PostgreSQL 数据库服务
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: fleet-manager-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet123}
      POSTGRES_DB: ${POSTGRES_DB:-fleet_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 后端服务 (FastAPI)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet-manager-backend
    ports:
      - "8000:8000"
    environment:
      # 数据库配置（生产环境使用 PostgreSQL）
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:-fleet123}@db:5432/${POSTGRES_DB:-fleet_manager}}
      # JWT 配置
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      # 调试模式
      - DEBUG=${DEBUG:-false}
      # OCR 配置（百度 OCR）
      - BAIDU_OCR_APP_ID=${BAIDU_OCR_APP_ID:-}
      - BAIDU_OCR_API_KEY=${BAIDU_OCR_API_KEY:-}
      - BAIDU_OCR_SECRET_KEY=${BAIDU_OCR_SECRET_KEY:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 前端服务 (Nginx + UniApp H5)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleet-manager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# 数据卷定义
# ============================================
volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local

# ============================================
# 网络配置
# ============================================
networks:
  default:
    name: fleet-manager-network
    driver: bridge
